name: Run Tests

on:
  push:
    branches:
      - main

    tags:
      - v*

  pull_request:

  workflow_dispatch:

jobs:
  test-projects:
    strategy:
      matrix:
        project: ["otelslog", "otelzap", "otelzerolog"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Golang with cache
        id: golang-with-cache
        uses: magnetikonline/action-golang-cache@fcca93e25c7fe3943de4d40c22d255d17f63e63b # v5
        with:
          go-version-file: ${{ matrix.project }}/go.mod

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@v2.5.0

      - name: Run tests
        run: |
          set -euo pipefail
          go test -json -v ./... 2>&1 | gotestfmt -hide empty-packages
